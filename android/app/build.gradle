import java.util.Properties

apply plugin: 'com.android.application'
// Jetpack Glance widgets are @Composable, so the Kotlin Compose compiler is
// required. AGP 9 compiles Kotlin itself (built-in Kotlin); this plugin only
// adds the compiler plugin. Version pinned in the root build.gradle classpath.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing. keystore.properties lives next to this project, is
// gitignored, and is absent on a fresh clone — so debug builds and anyone
// cloning the repo keep working, and only release builds need it. Without it
// a release build still succeeds, just unsigned. See WORK.md for setup.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.roberrini.okayweather"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "com.roberrini.okayweather"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    buildFeatures {
        compose = true
    }
    signingConfigs {
        if (!keystoreProperties.isEmpty()) {
            create('release') {
                // storeFile may be absolute, or relative to the android/ dir.
                storeFile = rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword = keystoreProperties.getProperty('storePassword')
                keyAlias = keystoreProperties.getProperty('keyAlias')
                keyPassword = keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 is left off deliberately: this app's surface is a Capacitor
            // WebView bridge plus Glance composables, both of which resolve
            // classes reflectively, so shrinking needs its own test pass
            // before it can be trusted in a store build.
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // null when keystore.properties is absent -> unsigned release.
            signingConfig = signingConfigs.findByName('release')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Home-screen widget (see src/main/java/com/roberrini/okayweather/widget).
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    // Periodic weather refresh for the widget (CoroutineWorker).
    implementation "androidx.work:work-runtime-ktx:$workVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
